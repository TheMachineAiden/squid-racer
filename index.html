<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1c37"><meta name="description" content="A small squid-powered arcade race."><title>Squid Racer</title><link rel="stylesheet" href="style.css"></head><body><main class="app" aria-labelledby="game-title"><header class="masthead"><p class="eyebrow">DEEP-SEA EXPRESS // ISSUE 01</p><h1 id="game-title">SQUID <span>RACER</span></h1><p class="tagline">One ink-powered squid. One very long delivery route.</p></header><section class="cabinet" aria-label="Squid Racer game"><div class="hud" aria-live="polite"><div><span>SCORE</span><strong id="score">0000</strong></div><div><span>DISTANCE</span><strong id="distance">0m</strong></div><div><span>INK</span><strong id="ink">● ● ●</strong></div></div><div class="game-wrap"><canvas id="game" width="720" height="720" aria-label="Race course"></canvas><div class="screen" id="screen"><p>INCOMING DELIVERY</p><h2>MAKE IT<br>TO THE END.</h2><p id="screen-copy">Steer around crates. Grab bubbles. Stay curious.</p><button id="start">START THE RACE →</button><small>← → / A D to steer &nbsp; • &nbsp; SPACE to boost</small></div><button id="pause" aria-label="Pause game" hidden>Ⅱ</button></div><div class="touch"><button data-control="left" aria-label="Steer left">←</button><button data-control="boost">BOOST</button><button data-control="right" aria-label="Steer right">→</button></div></section><footer>DO NOT FOLD THE MAP　✦　BEST WITH SOUND</footer></main><script src="game.js"></script></body></html>
